              <button className="btn-icon" style={{width:28,height:28}} onClick={()=>startEdit(de)}>✏️</button>
              <button className="btn-icon" style={{width:28,height:28}} onClick={()=>deleteDebt(de)}>{Icons.trash}</button>
            </div></td>
          </tr>)}
        </tbody></table></div>}
    </div>
    {(showAdd||editItem)&&<Modal title={editItem?'ویرایش بدهی':'ثبت بدهی جدید'} onClose={()=>{setShowAdd(false);setEditItem(null)}}>
      <div className="form-grid">
        <div className="form-group full"><label className="form-label">نام بدهی</label><input className="form-input" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></div>
        <div className="form-group full"><label className="form-label">مبلغ ({getUnitLabel(unit)})</label><input className="form-input" type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}/>
          {form.amount&&<div className="money-inline-words" style={{marginTop:4}}>{numberToPersianWords(parseInt(form.amount))} {getUnitLabel(unit)}</div>}</div>
        <div className="form-group full"><label className="form-label">توضیحات</label><input className="form-input" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))}/></div>
      </div>
      <div className="modal-actions"><button className="btn btn-accent" onClick={editItem?updateDebt:addDebt}>{Icons.check} {editItem?'ذخیره':'ثبت'}</button><button className="btn btn-outline" onClick={()=>{setShowAdd(false);setEditItem(null)}}>انصراف</button></div>
    </Modal>}
  </div>;
}

function AllocationPage({data,setData,setToast}){
  const unit=data.settings?.unit||'toman';
  const availableChecks=data.checks.filter(c=>c.status==='cashed');
  const [selectedCheck,setSelectedCheck]=useState(null);
  const [showCashModal,setShowCashModal]=useState(false);
  const cashBalance=useMemo(()=>calcCashBalance(data),[data]);
  const cashIn=useMemo(()=>availableChecks.reduce((s,c)=>s+c.amount,0),[availableChecks]);
  const cashOut=cashIn-cashBalance;
  const getAllocsFor=(ch)=>data.allocations.filter(a=>a.checkId===ch.id);
  const getTotalAllocFor=(ch)=>getAllocsFor(ch).reduce((s,a)=>s+a.amount,0);
  const handleSaveAlloc=(check,newAllocs)=>{
    setData(d=>{
      const others=d.allocations.filter(a=>a.checkId!==check.id);
      const fresh=newAllocs.filter(a=>a.amount>0).map(a=>({id:genId(),checkId:check.id,expenseId:a.expenseId,amount:a.amount,date:todayISO()}));
      const newData={...d,allocations:[...others,...fresh]};
      newData.paidRecord={...newData.paidRecord,expenses:syncPaidFromAllocations(newData)};
      const sum=newAllocs.reduce((s,a)=>s+a.amount,0);
      return recordTx(newData,{type:'alloc',title:'تخصیص چک '+check.payerName,amount:sum,meta:{count:newAllocs.length}});
    });
    setToast('تخصیص ذخیره شد');
    setSelectedCheck(null);
  };
  return <div>
    <div className="page-header"><h2>تخصیص خودکار</h2><p>تخصیص مبلغ چک‌های نقد شده یا موجودی صندوق به هزینه‌ها</p></div>
    <div className="cash-card">
      <div className="cash-card-head">
        <div style={{minWidth:0,flex:1}}>
          <div className="cash-card-title">💰 صندوق نقدی</div>
          <div className="cash-card-sub">موجودی قابل استفاده از چک‌های نقد شده</div>
          <div style={{fontSize:10.5,color:'var(--text-muted)',marginTop:4}}>جمع دریافتی: {formatMoney(cashIn)} — جمع پرداختی: {formatMoney(cashOut)} {getUnitLabel(unit)}</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <div style={{textAlign:'left'}}><div className="cash-card-balance">{formatMoney(cashBalance)} {getUnitLabel(unit)}</div><div className="cash-card-words">{numberToPersianWords(cashBalance)} {getUnitLabel(unit)}</div></div>
          <button className="btn btn-accent btn-sm" onClick={()=>setShowCashModal(true)} disabled={cashBalance<=0}>{Icons.cash} پرداخت از صندوق</button>
        </div>
      </div>
    </div>
    {availableChecks.length===0?<div className="card"><div className="empty-state"><p>هنوز چک نقد شده‌ای نیست</p></div></div>:
      availableChecks.map(ch=>{
        const allocs=getAllocsFor(ch);
        const total=getTotalAllocFor(ch);
        const pct=Math.min(100,Math.round((total/ch.amount)*100));
        const rem=ch.amount-total;
        return <div key={ch.id} className="allocation-card">
          <div className="allocation-header">
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontWeight:700,fontSize:15,color:'#fff'}}>{ch.payerName}</div>
              <div style={{fontSize:12,color:'var(--text-secondary)',marginTop:2}}>مبلغ: <span style={{color:'var(--accent)',fontWeight:600}}>{formatMoney(ch.amount)}</span> {getUnitLabel(unit)} — سررسید: {JalaliDate.formatGregorian(ch.dueDate)}</div>
              {ch.notes&&<div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>📝 {ch.notes}</div>}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <span style={{fontSize:12,color:rem>0?'var(--warning)':'var(--success)',fontWeight:600}}>{rem>0?'باقیمانده: '+formatMoney(rem):'کامل تخصیص شد'}</span>
              <button className="btn btn-accent btn-sm" onClick={()=>setSelectedCheck(ch)}>{Icons.allocate} {total>0?'ویرایش':'تخصیص'}</button>
            </div>
          </div>
          <div className="allocation-bar"><div className="allocation-fill" style={{width:pct+'%',background:pct>=100?'var(--success)':pct>0?'var(--accent)':'var(--surface-3)'}}></div></div>
          {allocs.length>0&&<div className="allocation-items">{allocs.map(a=>{const ex=data.expenses.find(e=>e.id===a.expenseId);return <div key={a.id} className="allocation-item"><div style={{display:'flex',alignItems:'center',gap:8,minWidth:0}}><span style={{width:8,height:8,borderRadius:'50%',background:getCategoryColor(ex?.category||'misc'),flexShrink:0}}></span><span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex?ex.name:'حذف شده'}</span></div><span style={{fontWeight:600,whiteSpace:'nowrap',color:'var(--accent)'}}>{formatMoney(a.amount)} {getUnitLabel(unit)}</span></div>})}</div>}
        </div>;})}
    {selectedCheck&&<AllocationModal check={selectedCheck} data={data} onSave={(allocs)=>handleSaveAlloc(selectedCheck,allocs)} onClose={()=>setSelectedCheck(null)}/>}
    {showCashModal&&<CashAllocationModal data={data} setData={setData} onSave={()=>{setToast('ثبت شد');setShowCashModal(false)}} onClose={()=>setShowCashModal(false)}/>}
  </div>;
}

function TransactionsPage({data}){
  const unit=data.settings?.unit||'toman';
  const [startDate,setStartDate]=useState('');
  const [endDate,setEndDate]=useState('');
  const [typeFilter,setTypeFilter]=useState('all');
  const [page,setPage]=useState(1);
  const PER_PAGE=10;
  const allTx=useMemo(()=>{let arr=[...(data.transactions||[])];arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return arr},[data.transactions]);
  const filtered=useMemo(()=>allTx.filter(tx=>{if(typeFilter!=='all'&&tx.type!==typeFilter)return false;if(startDate&&tx.date<startDate)return false;if(endDate&&tx.date>endDate)return false;return true}),[allTx,startDate,endDate,typeFilter]);
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  const currentPage=Math.min(page,totalPages);
  const pageItems=filtered.slice((currentPage-1)*PER_PAGE,currentPage*PER_PAGE);
  const totalIn=filtered.filter(tx=>(TX_TYPES[tx.type]||{}).kind==='in').reduce((s,tx)=>s+(tx.amount||0),0);
  const totalOut=filtered.filter(tx=>(TX_TYPES[tx.type]||{}).kind==='out').reduce((s,tx)=>s+(tx.amount||0),0);
  const clearFilters=()=>{setStartDate('');setEndDate('');setTypeFilter('all');setPage(1)};
  const uniqueTypes=Object.keys(TX_TYPES);
  return <div>
    <div className="page-header"><h2>تراکنش‌ها</h2><p>تاریخچه‌ی کامل تمام فعالیت‌ها ({getUnitLabel(unit)})</p></div>
    <div className="stats-grid cols-3">
      <div className="stat-card blue"><div className="stat-label">کل تراکنش‌ها</div><div className="stat-value" style={{color:'var(--info)',fontSize:22}}>{formatMoney(filtered.length)} مورد</div></div>
      <div className="stat-card green"><div className="stat-label">مجموع ورودی‌ها</div><div className="stat-value" style={{color:'var(--success)',fontSize:22}}>{formatMoney(totalIn)} {getUnitLabel(unit)}</div><div className="stat-words">{moneyWords(totalIn,unit)}</div></div>
      <div className="stat-card red"><div className="stat-label">مجموع خروجی‌ها</div><div className="stat-value" style={{color:'var(--danger)',fontSize:22}}>{formatMoney(totalOut)} {getUnitLabel(unit)}</div><div className="stat-words">{moneyWords(totalOut,unit)}</div></div>
    </div>
    <div className="card">
      <div className="filter-grid">
        <div className="form-group"><label className="form-label">از تاریخ</label><JalaliDatePicker value={startDate} onChange={v=>{setStartDate(v);setPage(1)}}/></div>
        <div className="form-group"><label className="form-label">تا تاریخ</label><JalaliDatePicker value={endDate} onChange={v=>{setEndDate(v);setPage(1)}}/></div>
        <div className="form-group"><label className="form-label">نوع</label>
          <select className="form-input" value={typeFilter} onChange={e=>{setTypeFilter(e.target.value);setPage(1)}}>
            <option value="all">همه</option>
            {uniqueTypes.map(k=><option key={k} value={k}>{TX_TYPES[k].label}</option>)}
          </select>
        </div>
        <div className="filter-actions"><button className="btn btn-outline btn-sm" onClick={clearFilters}>پاک کردن فیلتر</button></div>
      </div>
      {pageItems.length===0?<div className="empty-state"><p>تراکنشی یافت نشد</p></div>:
        <div className="table-wrap"><table><thead><tr><th>تاریخ</th><th>نوع</th><th>عنوان</th><th>مبلغ</th></tr></thead><tbody>
          {pageItems.map(tx=>{const tt=TX_TYPES[tx.type]||{label:tx.type,kind:'info'};return <tr key={tx.id}>
            <td style={{fontWeight:500,whiteSpace:'nowrap'}}>{JalaliDate.formatGregorian(tx.date)}</td>
            <td><span className={'tx-badge '+tt.kind}>{tt.label}</span></td>
            <td><div>{tx.title}</div>{tx.meta&&tx.meta.recipient&&<div className="tx-detail">👤 {tx.meta.recipient}</div>}{tx.meta&&tx.meta.note&&<div className="tx-detail">📝 {tx.meta.note}</div>}</td>
            <td style={{fontWeight:600,color:'var(--accent)',whiteSpace:'nowrap'}}>{tx.amount?formatMoney(tx.amount)+' '+getUnitLabel(unit):'-'}</td>
          </tr>})}
        </tbody></table></div>}
      {filtered.length>0&&<div className="pagination">
        <div className="pagination-info">نمایش {formatMoney((currentPage-1)*PER_PAGE+1)} تا {formatMoney(Math.min(currentPage*PER_PAGE,filtered.length))} از {formatMoney(filtered.length)} مورد</div>
        <div className="pagination-controls">
          <button className="page-btn" onClick={()=>setPage(1)} disabled={currentPage===1}>اول</button>
          <button className="page-btn" onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={currentPage===1}>قبلی</button>
          {Array.from({length:Math.min(5,totalPages)},(_,i)=>{let p;if(totalPages<=5)p=i+1;else if(currentPage<=3)p=i+1;else if(currentPage>=totalPages-2)p=totalPages-4+i;else p=currentPage-2+i;return <button key={p} className={'page-btn '+(p===currentPage?'active':'')} onClick={()=>setPage(p)}>{formatMoney(p)}</button>;})}
          <button className="page-btn" onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={currentPage===totalPages}>بعدی</button>
          <button className="page-btn" onClick={()=>setPage(totalPages)} disabled={currentPage===totalPages}>آخر</button>
        </div>
      </div>}
    </div>
  </div>;
}

function ShamsiCalendar({data}){
  const unit=data.settings?.unit||'toman';
  const [viewJY,setJY]=useState(JalaliDate.today().jy);
  const [viewJM,setJM]=useState(JalaliDate.today().jm);
  const [selectedDay,setSelectedDay]=useState(null);
  const monthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const nextMonth=()=>{if(viewJM===12){setJM(1);setJY(y=>y+1)}else setJM(m=>m+1);setSelectedDay(null)};
  const prevMonth=()=>{if(viewJM===1){setJM(12);setJY(y=>y-1)}else setJM(m=>m-1);setSelectedDay(null)};
  const totalDays=daysInJMonth(viewJY,viewJM);
  const firstDayG=JalaliDate.jalaliToGregorian(viewJY,viewJM,1);
  const firstDayJsDate=new Date(firstDayG.gy,firstDayG.gm-1,firstDayG.gd);
  let startDow=(firstDayJsDate.getDay()+1)%7;
  const jToday=JalaliDate.today();
  const days=[];
  for(let i=0;i<startDow;i++)days.push(null);
  for(let d=1;d<=totalDays;d++)days.push(d);
  const getEventsForDay=(jd)=>{
    const events=[];
    data.expenses.filter(e=>e.isRecurring&&effectiveDueDay(e.dueDay,viewJY,viewJM)===jd).forEach(ex=>{const k=ex.id+'_'+viewJY+'_'+viewJM;events.push({type:data.paidRecord.expenses[k]?'expense-paid':'expense',name:ex.name,amount:ex.amount})});
    data.checks.forEach(ch=>{const chG=new Date(ch.dueDate);const chJ=JalaliDate.gregorianToJalali(chG.getFullYear(),chG.getMonth()+1,chG.getDate());if(chJ.jy===viewJY&&chJ.jm===viewJM&&chJ.jd===jd){let type='check-pending';if(ch.status==='cashed')type='check-paid';else if(ch.status==='transferred')type='check-transferred';events.push({type,name:ch.payerName,amount:ch.amount})}});
    return events;
  };
  return <div className="card" style={{marginTop:20}}>
    <div className="card-header"><span className="card-title" style={{display:'flex',alignItems:'center',gap:8}}>{Icons.calendar} تقویم شمسی</span></div>
    <div className="month-selector"><button onClick={prevMonth}>{Icons.arrowLeft}</button><span>{monthNames[viewJM-1]} {viewJY}</span><button onClick={nextMonth}>{Icons.arrowRight}</button></div>
    <div className="calendar-grid">
      {['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'].map(d=><div key={d} className="calendar-header-cell">{d}</div>)}
      {days.map((d,i)=>{
        if(d===null)return <div key={'e'+i} className="calendar-day empty"></div>;
        const isToday=d===jToday.jd&&viewJM===jToday.jm&&viewJY===jToday.jy;
        const events=getEventsForDay(d);
        return <div key={d} className={'calendar-day '+(isToday?'today':'')} onClick={()=>setSelectedDay(selectedDay===d?null:d)}>
          <div className="calendar-day-num">{d}</div>
          {events.slice(0,3).map((ev,idx)=><div key={idx} className={'calendar-event '+ev.type}>{ev.name}</div>)}
          {events.length>3&&<div style={{fontSize:9,color:'var(--text-muted)'}}>+{events.length-3}</div>}
        </div>;
      })}
    </div>
    <div className="calendar-legend">
      <div className="calendar-legend-item"><div className="calendar-legend-dot" style={{background:'var(--info)'}}></div>هزینه</div>
      <div className="calendar-legend-item"><div className="calendar-legend-dot" style={{background:'var(--warning)'}}></div>چک منتظر</div>
      <div className="calendar-legend-item"><div className="calendar-legend-dot" style={{background:'var(--success)'}}></div>نقد شده</div>
      <div className="calendar-legend-item"><div className="calendar-legend-dot" style={{background:'#14B8A6'}}></div>منتقل شده</div>
    </div>
    {selectedDay&&<div style={{marginTop:16,padding:14,background:'var(--surface-2)',borderRadius:8,border:'1px solid var(--border)'}}>
      <div style={{fontWeight:600,marginBottom:8,fontSize:14,color:'#fff'}}>روز {selectedDay} {monthNames[viewJM-1]} {viewJY}</div>
      {getEventsForDay(selectedDay).length===0?<p style={{fontSize:13,color:'var(--text-muted)'}}>موردی ثبت نشده</p>:
        getEventsForDay(selectedDay).map((ev,idx)=><div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background:'var(--surface)',borderRadius:6,marginBottom:4,fontSize:13,gap:10,border:'1px solid var(--border)'}}>
          <span style={{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#fff'}}>{ev.name}</span>
          <span style={{fontWeight:600,whiteSpace:'nowrap',color:'var(--accent)'}}>{displayMoney(ev.amount,unit)}</span>
        </div>)}
    </div>}
  </div>;
}

function ReportsPage({data}){
  const unit=data.settings?.unit||'toman';
  const jToday=JalaliDate.today();
  const [viewJM,setJM]=useState(jToday.jm);
  const [viewJY,setJY]=useState(jToday.jy);
  const monthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const nextMonth=()=>{if(viewJM===12){setJM(1);setJY(y=>y+1)}else setJM(m=>m+1)};
  const prevMonth=()=>{if(viewJM===1){setJM(12);setJY(y=>y-1)}else setJM(m=>m-1)};
  const {startT,endT}=useMemo(()=>jalaliMonthRange(viewJY,viewJM),[viewJY,viewJM]);
  const monthChecks=useMemo(()=>data.checks.filter(c=>{const t=new Date(c.dueDate).getTime();return t>=startT&&t<=endT}),[data.checks,startT,endT]);
  const monthAllocs=useMemo(()=>data.allocations.filter(a=>{const ch=data.checks.find(c=>c.id===a.checkId);if(!ch)return false;const t=new Date(ch.dueDate).getTime();return t>=startT&&t<=endT}),[data.allocations,data.checks,startT,endT]);
  const income=monthChecks.filter(c=>c.status==='cashed').reduce((s,c)=>s+c.amount,0);
  const transferred=monthChecks.filter(c=>c.status==='transferred').reduce((s,c)=>s+c.amount,0);
  const pending=monthChecks.filter(c=>c.status==='pending').reduce((s,c)=>s+c.amount,0);
  const bounced=monthChecks.filter(c=>c.status==='bounced').reduce((s,c)=>s+c.amount,0);
  const totalPaid=monthAllocs.reduce((s,a)=>s+a.amount,0);
  const totalDebtAll=data.debts.filter(d=>!d.paid).reduce((s,d)=>s+d.amount,0);
  const chartRef=useRef(null),chartInst=useRef(null);
  useEffect(()=>{
    if(!chartRef.current)return;if(chartInst.current)chartInst.current.destroy();
    const days=Array.from({length:30},(_,i)=>i+1);
    const expByDay=days.map(d=>data.expenses.filter(e=>effectiveDueDay(e.dueDay,viewJY,viewJM)===d).reduce((s,e)=>s+e.amount,0));
    const allocByDay=days.map(d=>data.allocations.filter(a=>{const ex=data.expenses.find(e=>e.id===a.expenseId);return ex&&effectiveDueDay(ex.dueDay,viewJY,viewJM)===d}).reduce((s,a)=>s+a.amount,0));
    const hasData=expByDay.some(v=>v>0)||allocByDay.some(v=>v>0);
    const yScale=hasData?{beginAtZero:true,grid:{color:'#2A2A2A'},ticks:{color:'#A0A0A0',font:{family:'Vazirmatn',size:10},precision:0,callback:v=>formatMoneyTick(v,unit)}}:{beginAtZero:true,max:(unit==='toman'?1000000:10),grid:{color:'#2A2A2A'},ticks:{color:'#A0A0A0',font:{family:'Vazirmatn',size:10},precision:0,callback:v=>formatMoneyTick(v,unit)}};
    chartInst.current=new Chart(chartRef.current,{type:'bar',
      data:{labels:days.map(d=>d.toString()),datasets:[{label:'هزینه',data:expByDay,backgroundColor:'rgba(96,165,250,0.45)',borderColor:'#60A5FA',borderWidth:1,borderRadius:4},{label:'پرداخت شده',data:allocByDay,backgroundColor:'rgba(34,197,94,0.45)',borderColor:'#22C55E',borderWidth:1,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#FFFFFF',font:{family:'Vazirmatn',size:11},usePointStyle:true}}},scales:{x:{grid:{display:false},ticks:{color:'#A0A0A0',font:{family:'Vazirmatn',size:9}}},y:yScale}}});
    return()=>{if(chartInst.current)chartInst.current.destroy()};
  },[viewJM,viewJY,data.expenses,data.allocations,unit]);
  return <div>
    <div className="page-header"><h2>گزارش و تقویم</h2><p>خلاصه مالی و تقویم شمسی ({getUnitLabel(unit)})</p></div>
    <div className="month-selector"><button onClick={prevMonth}>{Icons.arrowLeft}</button><span>{monthNames[viewJM-1]} {viewJY}</span><button onClick={nextMonth}>{Icons.arrowRight}</button></div>
    <div className="stats-grid cols-5">
      <div className="stat-card green"><div className="stat-label">دریافتی</div><div className="stat-value" style={{color:'var(--success)',fontSize:18}}>{formatMoney(income)}</div></div>
      <div className="stat-card teal"><div className="stat-label">منتقل شده</div><div className="stat-value" style={{color:'#14B8A6',fontSize:18}}>{formatMoney(transferred)}</div></div>
      <div className="stat-card gold"><div className="stat-label">منتظر پاس</div><div className="stat-value" style={{color:'var(--accent)',fontSize:18}}>{formatMoney(pending)}</div></div>
      <div className="stat-card red"><div className="stat-label">برگشتی</div><div className="stat-value" style={{color:'var(--danger)',fontSize:18}}>{formatMoney(bounced)}</div></div>
      <div className="stat-card purple"><div className="stat-label">بدهی معوق</div><div className="stat-value" style={{color:'var(--purple)',fontSize:18}}>{formatMoney(totalDebtAll)}</div></div>
    </div>
    <div className="chart-box"><h3>مقایسه هزینه و پرداخت</h3><div className="chart-container"><canvas ref={chartRef}></canvas></div></div>
    <ShamsiCalendar data={data}/>
    <div className="card" style={{marginTop:20}}>
      <div className="card-header"><span className="card-title">جزئیات هزینه‌ها</span></div>
      <div className="table-wrap"><table><thead><tr><th>هزینه</th><th>مبلغ</th><th>روز</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr></thead><tbody>
        {data.expenses.slice().sort((a,b)=>a.dueDay-b.dueDay).map(ex=>{const k=ex.id+'_'+viewJY+'_'+viewJM;const isPaid=data.paidRecord.expenses[k];return <tr key={ex.id}>
          <td style={{fontWeight:600}}>{ex.name}</td><td style={{color:'var(--accent)'}}>{formatMoney(ex.amount)}</td><td>روز {ex.dueDay}</td>
          <td style={{color:isPaid?'var(--success)':'var(--text-muted)'}}>{isPaid?formatMoney(ex.amount):'۰'}</td>
          <td style={{color:isPaid?'var(--success)':'var(--danger)'}}>{isPaid?'۰':formatMoney(ex.amount)}</td>
          <td><span className={'badge '+(isPaid?'paid':'unpaid')}>{isPaid?'پرداخت شده':'پرداخت نشده'}</span></td>
        </tr>})}
      </tbody></table></div>
    </div>
  </div>;
}

function App(){
  const [data,setData]=useState(()=>{const loaded=loadData();if(!loaded)return getDefaultData();return normalizeData(loaded)});
  window.__ktdSetData=setData;
  const [currentPage,setCurrentPage]=useState('dashboard');
  const [toast,setToast]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [importPreview,setImportPreview]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const fileInputRef=useRef(null);
  const [showReminder,setShowReminder]=useState(()=>localStorage.getItem(REMINDER_KEY)!==todayISO());
  const closeReminder=()=>{localStorage.setItem(REMINDER_KEY,todayISO());setShowReminder(false)};
  useEffect(()=>{saveData(data)},[data]);
  useEffect(()=>{const onResize=()=>{if(window.innerWidth>1024)setSidebarOpen(false)};window.addEventListener('resize',onResize);return()=>window.removeEventListener('resize',onResize)},[]);
  useEffect(()=>{
    setData(d=>{
      const newPaid=syncPaidFromAllocations(d);
      let changed=false;
      const allKeys=new Set([...Object.keys(d.paidRecord?.expenses||{}),...Object.keys(newPaid)]);
      for(const k of allKeys){if(!!d.paidRecord?.expenses?.[k]!==!!newPaid[k]){changed=true;break}}
      if(!changed)return d;
      return{...d,paidRecord:{...d.paidRecord,expenses:newPaid}};
    });
  },[data.allocations,data.expenses]);
  const handleExportHtml=()=>{try{exportHtml(data);setToast('فایل HTML ذخیره شد')}catch(e){setToast('خطا: '+e.message)}};
  const handleExportJson=()=>{exportJson(data);setToast('فایل JSON دانلود شد')};
  const handleImportClick=()=>{fileInputRef.current&&fileInputRef.current.click()};
  const handleImportFile=(e)=>{const f=e.target.files?.[0];if(!f)return;parseImportFile(f,(parsed)=>{setImportPreview(parsed)});e.target.value=''};
  const handleImportReplace=()=>{setData(normalizeData(importPreview));setImportPreview(null);setToast('داده‌ها جایگزین شد')};
  const handleImportMerge=()=>{setData(prev=>mergeData(prev,importPreview));setImportPreview(null);setToast('داده‌ها ادغام شد')};
  const handleImportCancel=()=>{setImportPreview(null)};
  const pages=[
    {id:'dashboard',label:'داشبورد',icon:Icons.dashboard},
    {id:'checks',label:'چک‌ها',icon:Icons.checks},
    {id:'expenses',label:'هزینه‌ها',icon:Icons.expenses},
    {id:'debts',label:'بدهی‌ها',icon:Icons.debt},
    {id:'allocations',label:'تخصیص',icon:Icons.allocate},
    {id:'reports',label:'گزارش و تقویم',icon:Icons.report},
    {id:'transactions',label:'تراکنش‌ها',icon:Icons.list}
  ];
  const renderPage=()=>{
    switch(currentPage){
      case 'dashboard':return <Dashboard data={data} setCurrentPage={setCurrentPage}/>;
      case 'checks':return <ChecksPage data={data} setData={setData} setToast={setToast}/>;
      case 'expenses':return <ExpensesPage data={data} setData={setData} setToast={setToast}/>;
      case 'debts':return <DebtsPage data={data} setData={setData} setToast={setToast}/>;
      case 'allocations':return <AllocationPage data={data} setData={setData} setToast={setToast}/>;
      case 'reports':return <ReportsPage data={data}/>;
      case 'transactions':return <TransactionsPage data={data}/>;
      default:return <Dashboard data={data} setCurrentPage={setCurrentPage}/>;
    }
  };
  return <div className="app">
    <button className="menu-toggle" onClick={()=>setSidebarOpen(!sidebarOpen)}>{Icons.menu}</button>
    <div className={'sidebar-backdrop '+(sidebarOpen?'show':'')} onClick={()=>setSidebarOpen(false)}></div>
    <aside className={'sidebar '+(sidebarOpen?'open':'')}>
      <div className="sidebar-header"><h1><span>کابینت </span>سهند</h1><p>مدیریت جریان نقدینگی</p></div>
      <nav className="sidebar-nav">
        {pages.map(p=><div key={p.id} className={'nav-item '+(currentPage===p.id?'active':'')} onClick={()=>{setCurrentPage(p.id);setSidebarOpen(false)}}>{p.icon}<span>{p.label}</span></div>)}
        <div className="nav-item" onClick={()=>{setShowSettings(true);setSidebarOpen(false)}}>{Icons.settings}<span>تنظیمات</span></div>
      </nav>
      <div className="sidebar-footer">
        <div className="backup-grid">
          <button className="bk-btn primary" onClick={handleExportHtml}>💾 ذخیره در فایل HTML</button>
          <div className="backup-row"><button className="bk-btn" onClick={handleExportJson}>⬇ خروجی</button><button className="bk-btn" onClick={handleImportClick}>⬆ ورودی</button></div>
        </div>
        <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleImportFile}/>
        <div className="meta">نسخه ۶.۲ — فیکس باگ تاریخ شمسی</div>
      </div>
    </aside>
    <main className="main">{renderPage()}</main>
    {toast&&<Toast message={toast} onClose={()=>setToast(null)}/>}
    {showReminder&&<ReminderPopup data={data} setData={setData} setToast={setToast} onClose={closeReminder}/>}
    {importPreview&&<ImportModal importedData={importPreview} currentData={data} onReplace={handleImportReplace} onMerge={handleImportMerge} onCancel={handleImportCancel}/>}
    {showSettings&&<SettingsModal data={data} setData={setData} onClose={()=>setShowSettings(false)}/>}
  </div>;
}

Promise.resolve().then(function(){return window.KTD_SYNC.boot();})
  .catch(function(e){console.warn('[ktd-sync] boot error',e);})
  .then(function(){
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    window.KTD_SYNC.start();
  });
</script>

<script>
  if ('serviceWorker' in navigator) window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW failed', e); });
  });
</script>
