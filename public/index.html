<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decor Sahand</title>
<meta name="description" content="لانچر برنامه‌های دکور سهند: انبار کارگاه و مالی">
<meta name="theme-color" content="#d97706">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#0b1220; --panel:#121a2b; --panel2:#16203456; --line:#22304a;
    --txt:#e7edf7; --muted:#93a3bf; --pri:#d97706; --pri2:#ff9900; --ok:#22c55e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; background:
      radial-gradient(1000px 520px at 80% -10%, rgba(217,119,6,.20), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(255,153,0,.14), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:"Vazirmatn","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 18px calc(30px + env(safe-area-inset-bottom));
  }
  .brand{text-align:center;margin-top:8px}
  .brand .wm{display:inline-flex;flex-direction:column;align-items:center;line-height:.92;font-weight:800;letter-spacing:-.5px}
  .brand .wm span{font-size:40px}
  .brand .wm .b{color:#fff}
  .brand .wm .o{color:var(--pri2);text-shadow:0 4px 22px rgba(255,153,0,.45)}
  .brand .rule{width:132px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2));margin:9px auto 0;box-shadow:0 4px 18px rgba(217,119,6,.5)}
  .brand p{color:var(--muted);font-size:13.5px;margin:12px 0 0}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px; width:100%; max-width:620px; margin-top:26px;
  }
  .card{
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    background:linear-gradient(180deg,#141d31,#101828);
    border:1px solid var(--line); border-radius:20px; padding:20px;
    text-decoration:none; color:inherit; position:relative; overflow:hidden;
    transition:transform .16s ease, border-color .2s ease, box-shadow .2s ease;
    animation:pop .4s backwards; animation-delay:calc(var(--i,0) * 70ms);
  }
  .card:nth-child(2){animation-delay:.12s}
  .card::after{
    content:""; position:absolute; inset:auto -40px -70px auto; width:170px;height:170px;
    background:radial-gradient(circle, var(--ac,#d97706) 0%, transparent 65%); opacity:.20;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--ac); box-shadow:0 16px 40px rgba(0,0,0,.45)}
  .card:active{transform:scale(.985)}
  .card .ico{
    width:64px;height:64px;border-radius:16px;background:#fff;object-fit:contain;
    border:1px solid #00000018; box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .card h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px}
  .card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.85}
  .card .go{
    margin-top:4px; display:inline-flex;align-items:center;gap:8px;
    font-size:13.5px; font-weight:700; color:var(--ac);
  }
  .card .go svg{width:16px;height:16px}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .foot{margin-top:26px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .pill{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:#0f1728; border:1px solid var(--line); padding:7px 13px; border-radius:999px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .dot.off{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18)}
  button.pill{cursor:pointer;font-family:inherit;color:#ffd9a1;border-color:#5b3a12;background:#1b1409}
  button.pill:hover{border-color:var(--pri);color:#fff}
  .err{color:#fca5a5;font-size:12.5px;text-align:center;max-width:460px;line-height:1.9}
  @media (max-width:380px){ .brand .wm span{font-size:34px} }
</style>
</head>
<body>

<header class="brand">
  <span class="wm"><span class="b">Decor</span><span class="o">Sahand</span></span>
  <div class="rule"></div>
  <p>یک لینک، دو بخش مستقل — هر کدام با دیتابیس و داده‌ی خودش</p>
</header>

<main class="grid" id="grid"></main>

<div class="foot">
  <span class="pill"><span class="dot" id="netDot"></span><span id="netTxt">آنلاین</span></span>
  <button class="pill" id="installBtn" hidden>نصب روی گوشی</button>
</div>
<p class="err" id="err" hidden></p>

<script type="application/json" id="modules-fallback">
{
  "modules": [
    { "id": "anbar", "title": "انبار کارگاه", "subtitle": "ابزار، ورق، فاکتور، امانت ابزار و شمارش موجودی",
      "href": "anbar/", "icon": "anbar/icon-192.png", "accent": "#d97706" },
    { "id": "fin", "title": "مالی", "subtitle": "چک، بدهی، دریافتی‌ها و هزینه‌ها",
      "href": "fin/", "icon": "fin/icon-192.png", "accent": "#ff9900" }
  ]
}
</script>

<script>
(function () {
  'use strict';

  var grid = document.getElementById('grid');
  var errEl = document.getElementById('err');
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" ' +
              'stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';

  function fallback() {
    try {
      return JSON.parse(document.getElementById('modules-fallback').textContent);
    } catch (e) {
      return { modules: [] };
    }
  }

  function render(mods) {
    grid.innerHTML = '';
    if (!mods.length) {
      errEl.hidden = false;
      errEl.textContent = 'هیچ بخشی در رجیستری پیدا نشد (modules.json).';
      return;
    }
    mods.forEach(function (m, i) {
      var a = document.createElement('a');
      a.className = 'card';
      a.href = m.href;
      a.style.setProperty('--ac', m.accent || '#d97706');
      a.style.setProperty('--i', i);
      a.innerHTML =
        '<img class="ico" src="' + m.icon + '" alt="" width="64" height="64">' +
        '<h2></h2><p></p>' +
        '<span class="go">' + ARROW + 'ورود به بخش</span>';
      a.querySelector('h2').textContent = m.title;
      a.querySelector('p').textContent = m.subtitle || '';
      a.setAttribute('aria-label', m.title);
      grid.appendChild(a);
    });
  }

  // The registry is the single source of truth; the embedded copy only covers
  // the very first load before the service worker has cached anything.
  fetch('./modules.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) { render((d && d.modules) || []); })
    .catch(function () { render((fallback().modules) || []); });

  /* online / offline indicator */
  function net() {
    var on = navigator.onLine !== false;
    document.getElementById('netDot').className = 'dot' + (on ? '' : ' off');
    document.getElementById('netTxt').textContent = on ? 'آنلاین' : 'آفلاین — داده‌ها روی دستگاه می‌مانند';
  }
  window.addEventListener('online', net);
  window.addEventListener('offline', net);
  net();

  /* install prompt */
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    document.getElementById('installBtn').hidden = false;
  });
  document.getElementById('installBtn').addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; });
    this.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (e) {
        console.warn('SW registration failed', e);
      });
    });
  }
})();
</script>
</body>
</html>
